name: Ingest Checkbook data

# Scheduled ingestion runs here rather than as a Vercel cron.
#
# The pull is roughly 87 agencies per fiscal year, deliberately throttled about
# 3 seconds apart to clear Checkbook's Incapsula bot protection. That is far
# longer than a Vercel function may run (300s by default, 800s ceiling), which
# is why the previous api/cron/ingest.ts could never have completed even once.
# A GitHub Actions job may run for hours, so the throttle is affordable here.

on:
  schedule:
    # 08:00 UTC daily, matching the schedule the Vercel cron used to declare.
    - cron: "0 8 * * *"
  workflow_dispatch:

# Deliberately no pull_request trigger. This job reads DATABASE_URL, and a pull
# request from a fork must never be able to reach a secret.

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Generous: a full seven-year seed is about 30 minutes, and a refresh of the
    # two live years is under 10. The ceiling is here to catch a hang, not to
    # pace normal work.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Refresh the fiscal years that can still change
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run ingest -- --refresh
